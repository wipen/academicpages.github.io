name: Sync publications from ORCID

# 每天自动从 ORCID 拉一次成果；也可以在 Actions 页面手动点 “Run workflow”
on:
  schedule:
    - cron: "17 2 * * *"   # UTC 02:17 = 北京时间 10:17
  workflow_dispatch:
    inputs:
      prune:
        description: "同步删除 ORCID 上已撤下的条目"
        type: boolean
        default: false
  push:
    paths:
      - "scripts/orcid_sync.py"   # 脚本改了就立刻重跑一次

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ORCID sync
        run: |
          PRUNE=""
          if [ "${{ github.event.inputs.prune }}" = "true" ]; then PRUNE="--prune"; fi
          python scripts/orcid_sync.py --orcid 0009-0004-5701-7230 $PRUNE

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain _publications)" ]; then
            git add _publications
            git commit -m "chore(publications): sync from ORCID $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed updates."
          else
            echo "No publication changes."
          fi
